[package]
name = "nginx-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
minijinja = "2.11.0"
pathdiff = "0.2.3"
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
